name: Build offline atlas
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/viewer.html'
      - 'tools/build.py'
      - '.github/workflows/build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pillow
      - run: python tools/build.py
      - name: Ensure GitHub file size limit
        run: test "$(stat -c %s index.html)" -lt 104857600
      - name: Upload standalone atlas and maps
        uses: actions/upload-artifact@v4
        with:
          name: ares-mars-16k
          path: |
            index.html
            assets/viking-16384.jpg
            assets/mola-8192.delta16.gz
          if-no-files-found: error
